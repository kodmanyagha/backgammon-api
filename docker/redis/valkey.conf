##################################
# NETWORK
##################################

# Listen on all interfaces (restrict via firewall in production)
bind 0.0.0.0

# TCP Port
port 6379

# Unix socket
unixsocket /app/redis/data/valkey.sock
unixsocketperm 770

# Disable protected mode if behind firewall
protected-mode no

# TCP optimizations
tcp-backlog 511
timeout 0
tcp-keepalive 60

##################################
# GENERAL
##################################

daemonize yes
supervised systemd
pidfile /app/redis/data/valkey.pid

loglevel notice
logfile /app/redis/data/valkey.log

databases 16

##################################
# PERFORMANCE CORE
##################################

# High-performance I/O threads (if multi-core CPU)
io-threads 4
io-threads-do-reads yes

# Disable stop-writes on bgsave error (avoid service freeze)
stop-writes-on-bgsave-error no

##################################
# MEMORY MANAGEMENT
##################################

# Adjust based on your RAM (example: 16GB server)
maxmemory 8gb

# Best general-purpose eviction policy
maxmemory-policy allkeys-lru

# Enable active defragmentation
activedefrag yes
active-defrag-ignore-bytes 100mb
active-defrag-threshold-lower 10
active-defrag-threshold-upper 100

##################################
# PERSISTENCE (Balanced Performance)
##################################

# RDB snapshotting (low overhead)
save 900 1
save 300 10
save 60 10000

rdbcompression yes
rdbchecksum yes

# AOF disabled for max performance
appendonly no

# If you need durability, use this instead:
# appendonly yes
# appendfsync everysec

##################################
# CLIENT LIMITS
##################################

maxclients 20000

##################################
# THREADING & LATENCY
##################################

hz 100
dynamic-hz yes

##################################
# SECURITY (Adjust!)
##################################

# Require authentication (strongly recommended)
# requirepass YOUR_STRONG_PASSWORD

##################################
# SLOW LOG
##################################

slowlog-log-slower-than 10000
slowlog-max-len 128

##################################
# LATENCY MONITOR
##################################

latency-monitor-threshold 100

##################################
# REPLICATION (if master)
##################################

replica-serve-stale-data yes
replica-read-only yes
