  mysql:
    build:
      context: ./docker/mysql
      dockerfile: Dockerfile
      args:
        DOCKER_UID: "${DOCKER_UID}"
        DOCKER_GID: "${DOCKER_GID}"
        DOCKER_USER: "${DOCKER_USER}"
        DOCKER_GROUP: "${DOCKER_GROUP}"
        MYSQL_ROOT_PASSWORD: "${DB_PASSWORD}"
        MYSQL_ROOT_HOST: "%"
        MYSQL_DATABASE: "${DB_DATABASE}"
        MYSQL_USER: "${DB_USERNAME}"
        MYSQL_PASSWORD: "${DB_PASSWORD}"
        MYSQL_ALLOW_EMPTY_PASSWORD: 1
    volumes:
      - "./:/home/${DOCKER_USER}/app"
      - "./docker/volumes/mysql:/home/${DOCKER_USER}/mysql_data/data"
    # Fix "mbind: Operation not permitted" problem
    cap_add:
      - SYS_NICE
    networks:
      - app
    ports:
      - "127.0.0.1:${FORWARD_MYSQL_PORT:-3307}:3306"
    restart: always
    healthcheck:
      test: ["CMD", "mysql", "ping"]
      retries: 3
      timeout: 35s
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=1
    dns:
      - 8.8.8.8
      - 1.1.1.1

  redis:
    build:
      context: ./docker/redis
      dockerfile: Dockerfile
      args:
        DOCKER_UID: "${DOCKER_UID}"
        DOCKER_GID: "${DOCKER_GID}"
        DOCKER_USER: "${DOCKER_USER}"
        DOCKER_GROUP: "${DOCKER_GROUP}"
    volumes:
      - "./:/home/${DOCKER_USER}/app"
      - "./docker/volumes/redis:/app/redis/data"
    # Fix "mbind: Operation not permitted" problem
    cap_add:
      - SYS_NICE
    networks:
      - app
    ports:
      - "127.0.0.1:${FORWARD_REDIS_PORT:-6379}:6379"
    restart: always
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      retries: 3
      timeout: 5s
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=1
    dns:
      - 8.8.8.8
      - 1.1.1.1

networks:
  app:
    driver: bridge
    enable_ipv6: false

volumes:
  app-mysql:
    driver: local
  app-redis:
    driver: local
